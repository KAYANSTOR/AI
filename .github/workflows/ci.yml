name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/frontdesk_ci
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret
      CREDENTIAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      GEMINI_API_KEY: ci-placeholder
      CRON_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Install
        id: web_install
        run: npm ci
      - name: Diff Whitespace Check
        run: git diff --check HEAD^ HEAD
      - name: Owner Console Typecheck
        run: npm run lint --workspace @kayan-ai/owner-console
      - name: Lint
        run: |
          report="$RUNNER_TEMP/web-eslint.json"
          lint_status=0
          npm run lint --workspace=apps/web -- --format json --output-file "$report" || lint_status=$?
          if [ -f "$report" ]; then
            node --input-type=module - "$report" <<'JS'
          import { readFileSync } from 'node:fs'
          import { relative } from 'node:path'
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          for (const { filePath, messages } of report) {
            for (const { severity, ruleId, line, column } of messages) {
              if (severity !== 2) continue
              const file = relative(process.cwd(), filePath)
              console.log(`::error file=${file},line=${line ?? 1},col=${column ?? 1}::ESLint: ${ruleId ?? 'parser error'}`)
            }
          }
          JS
          fi
          exit "$lint_status"
      - name: Typecheck
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        shell: bash
        run: |
          log="$RUNNER_TEMP/unit-tests.log"
          status=0
          npm run test --workspace=apps/web 2>&1 | tee "$log" || status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            node --input-type=module - "$log" <<'JS'
          import { readFileSync } from 'node:fs'
          import { stripVTControlCharacters } from 'node:util'
          let file = ''
          let count = 0
          for (const line of stripVTControlCharacters(readFileSync(process.argv[2], 'utf8')).split('\n')) {
            const testFile = /^(?:apps\/web\/)?(tests\/[\w./-]+\.test\.[tj]sx?):\s*$/.exec(line)
            if (testFile) file = ` file=apps/web/${testFile[1]}`
            const failure = /^\s*\(fail\)\s+(.+)/.exec(line)?.[1]
            if (!failure) continue
            console.log(`::error${file}::Unit test failed: ${failure.replaceAll('%', '%25').replaceAll('\r', '%0D')}`)
            if (++count === 15) break
          }
          JS
          fi
          exit "$status"
      - name: Gateway entrypoint syntax
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: |
          node --check apps/whatsapp-gateway/src/server.js
          node --check start-with-gateway.mjs
      - name: Gateway unit tests
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: node --test apps/whatsapp-gateway/test/*.test.js
      - name: Build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frontdesk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/frontdesk_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply migrations
        run: npm run db:migrate
      - name: Verify knowledge runtime
        run: node packages/db/scripts/verify-knowledge-runtime.mjs
      - name: Verify Phase 5 RLS on PostgreSQL
        run: node packages/db/scripts/verify-phase5-rls.mjs
      - name: Verify Phase 6 RLS and accounting on PostgreSQL
        run: node packages/db/scripts/verify-phase6-rls.mjs
      - name: Verify atomic central link on PostgreSQL
        run: node packages/db/scripts/verify-central-link.mjs
      - name: Verify dashboard tour progress isolation
        run: node packages/db/scripts/verify-tour-progress.mjs
      - name: Verify migrations
        run: npm run db:status
