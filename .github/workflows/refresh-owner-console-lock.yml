name: Refresh npm workspace lockfile

on:
  push:
    branches: [feature/channels-expansion]
    paths:
      - package.json
      - apps/owner-console/package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/channels-expansion
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate workspace lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Keep public GitHub dependencies on HTTPS
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'package-lock.json'
          const lock = JSON.parse(readFileSync(path, 'utf8'))
          const prefix = 'git+ssh://git@github.com/'
          const replacement = 'git+https://github.com/'
          let changed = false
          for (const entry of Object.values(lock.packages || {})) {
            if (typeof entry.resolved !== 'string' || !entry.resolved.startsWith(prefix)) continue
            entry.resolved = replacement + entry.resolved.slice(prefix.length)
            changed = true
          }
          if (changed) writeFileSync(path, JSON.stringify(lock, null, 2) + String.fromCharCode(10))
          NODE
      - name: Commit updated lockfile when needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh npm workspace lockfile"
          git push
