name: outbox-cron
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: outbox-cron
  cancel-in-progress: false
permissions: {}
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Trigger outbox worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OUTBOX_CRON_URL: ${{ vars.OUTBOX_CRON_URL || 'https://frontdesk-ai-eosin.vercel.app/api/cron/outbox' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET repository secret is not set"; exit 1; fi
          curl --fail-with-body -sS -X POST --max-time 120 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" "$OUTBOX_CRON_URL"

      - name: Trigger follow-up worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FOLLOWUP_CRON_URL: ${{ vars.FOLLOWUP_CRON_URL || 'https://frontdesk-ai-eosin.vercel.app/api/cron/followup' }}
        run: |
          curl --fail-with-body -sS -X POST --max-time 120 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" "$FOLLOWUP_CRON_URL"

      - name: Trigger SLA refresh worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SLA_CRON_URL: ${{ vars.SLA_CRON_URL || 'https://frontdesk-ai-eosin.vercel.app/api/cron/sla' }}
        run: |
          curl --fail-with-body -sS -X POST --max-time 120 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" "$SLA_CRON_URL"

      - name: Trigger quote expiry worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          QUOTES_EXPIRE_URL: ${{ vars.QUOTES_EXPIRE_URL || 'https://frontdesk-ai-eosin.vercel.app/api/cron/quotes-expire' }}
        run: |
          curl --fail-with-body -sS -X POST --max-time 120 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" "$QUOTES_EXPIRE_URL"

      - name: Trigger appointment reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APPT_REMINDERS_URL: ${{ vars.APPT_REMINDERS_URL || 'https://frontdesk-ai-eosin.vercel.app/api/cron/appointment-reminders' }}
        run: |
          curl --fail-with-body -sS -X POST --max-time 120 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" "$APPT_REMINDERS_URL"

      - name: Trigger workflow runner
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WORKFLOWS_URL: ${{ vars.WORKFLOWS_URL || 'https://frontdesk-ai-eosin.vercel.app/api/cron/workflows' }}
        run: |
          curl --fail-with-body -sS -X POST --max-time 120 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" "$WORKFLOWS_URL"

      - name: Trigger campaigns processor
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CAMPAIGNS_URL: ${{ vars.CAMPAIGNS_URL || 'https://frontdesk-ai-eosin.vercel.app/api/cron/campaigns' }}
        run: |
          curl --fail-with-body -sS -X POST --max-time 120 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" "$CAMPAIGNS_URL"
