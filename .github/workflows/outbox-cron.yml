name: scheduled-workers
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: scheduled-workers
  cancel-in-progress: false
permissions: {}
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Trigger workers
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL variable or CRON_SECRET secret is not set; skipping."
            exit 0
          fi
          status=0
          for path in outbox followup sla quotes-expire appointment-reminders workflows campaigns; do
            echo "-> /api/cron/$path"
            curl --fail-with-body -sS -X POST --max-time 120 --retry 2 --retry-delay 10 \
              -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/$path" || status=1
          done
          exit $status
